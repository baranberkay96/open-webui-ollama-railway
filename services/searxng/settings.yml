# Minimal overrides on top of SearXNG's defaults (use_default_settings).
# server.secret_key is replaced at runtime by the SEARXNG_SECRET variable.
use_default_settings: true

general:
  instance_name: "SearXNG (private)"
  enable_metrics: false

server:
  secret_key: "set-by-SEARXNG_SECRET-at-runtime"
  # Only reachable on the Railway private network by Open WebUI: no bot limiter needed.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  # Open WebUI queries /search?format=json
  formats:
    - html
    - json
